name: Publicar sitio

# Se ejecuta cada vez que se sube un cambio a main — ya sea editado a mano o
# guardado desde el panel de edición (Sveltia CMS hace un commit normal a
# este mismo repositorio). Arma el sitio con Eleventy y lo publica en
# GitHub Pages.
#
# También se ejecuta solo, una vez por día (6:00 de la mañana, hora de
# Argentina), sin que nadie tenga que tocar nada. Esto es lo que permite
# programar una nota de blog con fecha futura: aunque no haya ningún cambio
# nuevo ese día, este build diario "revisa" las fechas y publica las notas
# que ya les tocaba salir.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 Argentina (no tiene horario de verano)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Armar el sitio (Eleventy)
        run: npm run build

      - name: Preparar para GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio armado
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
